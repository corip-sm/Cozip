<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Cozip Benchmark Summary</title>
  <desc id="desc">Sequential local benchmark summary comparing Cozip and Bandizip on 1GB, 10GB, and 40GB ZIP workloads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef4ef"/>
    </linearGradient>
    <style>
      .title { font: 700 42px 'Segoe UI', sans-serif; fill: #15263a; }
      .subtitle { font: 400 18px 'Segoe UI', sans-serif; fill: #586c7c; }
      .card { fill: #ffffff; stroke: #d7e1e8; stroke-width: 1.2; }
      .section { font: 700 30px 'Segoe UI', sans-serif; fill: #183247; }
      .meta { font: 400 16px 'Segoe UI', sans-serif; fill: #6d8190; }
      .rowlabel { font: 700 18px 'Segoe UI', sans-serif; fill: #234258; }
      .tool { font: 700 16px 'Segoe UI', sans-serif; }
      .value { font: 700 16px 'Segoe UI', sans-serif; fill: #15263a; }
      .note { font: 400 15px 'Segoe UI', sans-serif; fill: #6d8190; }
      .cozipText { fill: #0f9d58; }
      .bandiText { fill: #ff8a3d; }
      .track { fill: #edf2f5; }
      .cozipBar { fill: #17a65b; }
      .bandiBar { fill: #ff8b3d; }
      .divider { stroke: #edf2f5; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="url(#bg)"/>

  <text x="70" y="78" class="title">Cozip Benchmark Summary</text>
  <text x="70" y="112" class="subtitle">Release · sequential local runs · ZIP compatibility maintained</text>

  <g transform="translate(70,150)">
    <rect class="card" rx="22" ry="22" width="1060" height="205"/>
    <text x="30" y="42" class="section">1GB</text>
    <text x="30" y="70" class="meta">3-run average</text>
    <line x1="30" y1="92" x2="1030" y2="92" class="divider"/>

    <text x="30" y="128" class="rowlabel">Compress</text>
    <rect x="170" y="110" width="440" height="18" rx="9" class="track"/>
    <rect x="170" y="110" width="220" height="18" rx="9" class="cozipBar"/>
    <text x="630" y="125" class="tool cozipText">Cozip</text>
    <text x="705" y="125" class="value">0.895s</text>
    <rect x="820" y="110" width="160" height="18" rx="9" class="track"/>
    <rect x="820" y="110" width="160" height="18" rx="9" class="bandiBar"/>
    <text x="995" y="125" class="tool bandiText">Bandizip</text>
    <text x="1095" y="125" class="value" text-anchor="end">1.794s</text>

    <text x="30" y="172" class="rowlabel">Extract</text>
    <rect x="170" y="154" width="440" height="18" rx="9" class="track"/>
    <rect x="170" y="154" width="369" height="18" rx="9" class="cozipBar"/>
    <text x="630" y="169" class="tool cozipText">Cozip</text>
    <text x="705" y="169" class="value">0.476s</text>
    <rect x="820" y="154" width="160" height="18" rx="9" class="track"/>
    <rect x="820" y="154" width="160" height="18" rx="9" class="bandiBar"/>
    <text x="995" y="169" class="tool bandiText">Bandizip</text>
    <text x="1095" y="169" class="value" text-anchor="end">0.568s</text>
  </g>

  <g transform="translate(70,385)">
    <rect class="card" rx="22" ry="22" width="1060" height="205"/>
    <text x="30" y="42" class="section">10GB</text>
    <text x="30" y="70" class="meta">3-run average</text>
    <line x1="30" y1="92" x2="1030" y2="92" class="divider"/>

    <text x="30" y="128" class="rowlabel">Compress</text>
    <rect x="170" y="110" width="440" height="18" rx="9" class="track"/>
    <rect x="170" y="110" width="259" height="18" rx="9" class="cozipBar"/>
    <text x="630" y="125" class="tool cozipText">Cozip</text>
    <text x="705" y="125" class="value">11.072s</text>
    <rect x="820" y="110" width="160" height="18" rx="9" class="track"/>
    <rect x="820" y="110" width="160" height="18" rx="9" class="bandiBar"/>
    <text x="995" y="125" class="tool bandiText">Bandizip</text>
    <text x="1095" y="125" class="value" text-anchor="end">18.822s</text>

    <text x="30" y="172" class="rowlabel">Extract</text>
    <rect x="170" y="154" width="440" height="18" rx="9" class="track"/>
    <rect x="170" y="154" width="282" height="18" rx="9" class="cozipBar"/>
    <text x="630" y="169" class="tool cozipText">Cozip</text>
    <text x="705" y="169" class="value">6.927s</text>
    <rect x="820" y="154" width="160" height="18" rx="9" class="track"/>
    <rect x="820" y="154" width="160" height="18" rx="9" class="bandiBar"/>
    <text x="995" y="169" class="tool bandiText">Bandizip</text>
    <text x="1095" y="169" class="value" text-anchor="end">10.821s</text>
  </g>

  <g transform="translate(70,620)">
    <rect class="card" rx="22" ry="22" width="1060" height="170"/>
    <text x="30" y="42" class="section">40GB</text>
    <text x="30" y="70" class="meta">1-run snapshot</text>
    <line x1="30" y1="92" x2="1030" y2="92" class="divider"/>

    <text x="30" y="132" class="rowlabel">Compress</text>
    <text x="220" y="132" class="tool cozipText">Cozip</text>
    <text x="295" y="132" class="value">80.292s</text>
    <text x="520" y="132" class="tool bandiText">Bandizip</text>
    <text x="640" y="132" class="value">85.680s</text>

    <text x="30" y="162" class="rowlabel">Extract</text>
    <text x="220" y="162" class="tool cozipText">Cozip</text>
    <text x="295" y="162" class="value">54.366s</text>
    <text x="520" y="162" class="tool bandiText">Bandizip</text>
    <text x="640" y="162" class="value">76.362s</text>
  </g>
</svg>
